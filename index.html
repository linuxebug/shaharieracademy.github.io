<!-- index.html (Login / Register Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shaharier Academy</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="top-controls">
        <div></div> <!-- Empty div to push controls to the right -->
        <div class="right-controls">
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
            <div class="select-wrapper">
                <i class="fas fa-globe"></i>
                <select class="language-switcher">
                    <option value="en">English</option>
                    <option value="bn">বাংলা</option>
                </select>
            </div>
        </div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-user-circle login-icon"></i>
            <h2 id="auth-title" data-i18n="login_title">Login to Your Account</h2>
        </div>
        
        <form id="email-auth-form" class="auth-form">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn" class="auth-btn email-btn">
                <i class="fas fa-envelope"></i> <span id="submit-btn-text" data-i18n="login_btn">Login</span>
            </button>
        </form>

        <p class="toggle-text">
            <span id="toggle-prompt" data-i18n="no_account">Don't have an account?</span> 
            <a href="#" id="toggle-link" data-i18n="create_one">Create Account</a>
        </p>

        <div class="divider"><span data-i18n="or">OR</span></div>

        <div class="auth-buttons">
            <button type="button" id="google-login" class="auth-btn google">
                <i class="fab fa-google"></i> <span data-i18n="login_google">Continue with Google</span>
            </button>
            <button type="button" id="apple-login" class="auth-btn apple">
                <i class="fab fa-apple"></i> <span data-i18n="login_apple">Continue with Apple</span>
            </button>
        </div>
        <p id="error-message" class="error-msg"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
